<app-modal [isOpen]="isOpen" title="Nuevo Proveedor" [confirmText]="saving() ? 'Guardando...' : 'Guardar'"
           confirmButtonClass="bg-blue-600 hover:bg-blue-700" maxWidthClass="max-w-2xl"
           (closeEvent)="closed.emit()" (confirmEvent)="save()">
  @if (error()) {
    <div class="mb-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg p-3 text-sm text-red-600 dark:text-red-400">{{ error() }}</div>
  }
  <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Codigo</label>
      <input type="text" value="PRV-(auto)" readonly class="w-full px-3 py-2 border border-slate-200 dark:border-slate-600 rounded-lg text-sm bg-slate-50 dark:bg-slate-900/50 text-slate-500 font-mono"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Codigo REEUP</label>
      <input type="text" [(ngModel)]="form.reeupCode" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1 sm:col-span-2">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Nombre <span class="text-red-500">*</span></label>
      <input type="text" [(ngModel)]="form.businessName" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Abreviatura</label>
      <input type="text" [(ngModel)]="form.tradeName" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">NIT</label>
      <input type="text" [(ngModel)]="form.nit" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">IRCC</label>
      <input type="text" [(ngModel)]="form.ircc" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Telefono</label>
      <input type="text" [(ngModel)]="form.contactPhone" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Email</label>
      <input type="email" [(ngModel)]="form.contactEmail" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Provincia</label>
      <input type="text" [(ngModel)]="form.province" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Pais</label>
      <input type="text" [(ngModel)]="form.country" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
    <div class="space-y-1 sm:col-span-2">
      <label class="text-xs font-semibold text-slate-700 dark:text-slate-300">Direccion</label>
      <input type="text" [(ngModel)]="form.address" class="w-full px-3 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm bg-white dark:bg-slate-700 dark:text-white focus:outline-none focus:ring-2 focus:ring-blue-500"/>
    </div>
  </div>
</app-modal>
