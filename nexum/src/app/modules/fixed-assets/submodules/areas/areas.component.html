<div class="p-6 bg-gradient-to-br from-slate-50 to-slate-100 min-h-screen">
  @if (toast()) {
    <div class="fixed top-6 right-6 z-50 flex items-center gap-3 px-4 py-3 rounded-xl shadow-lg text-sm font-medium border transition-all"
         [class.bg-green-50]="toast()!.type === 'success'"
         [class.text-green-800]="toast()!.type === 'success'"
         [class.border-green-200]="toast()!.type === 'success'"
         [class.bg-red-50]="toast()!.type === 'error'"
         [class.text-red-800]="toast()!.type === 'error'"
         [class.border-red-200]="toast()!.type === 'error'"
         [class.bg-blue-50]="toast()!.type === 'info'"
         [class.text-blue-800]="toast()!.type === 'info'"
         [class.border-blue-200]="toast()!.type === 'info'">
      {{ toast()!.message }}
    </div>
  }

  <div class="flex items-center justify-between mb-6">
    <div class="flex items-center gap-3">
      <div class="p-2 bg-emerald-100 rounded-xl">
        <svg class="w-5 h-5 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/>
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/>
        </svg>
      </div>
      <div>
        <h2 class="text-xl font-semibold text-slate-800">Áreas</h2>
        <p class="text-xs text-slate-500">Gestión de áreas de activos fijos</p>
      </div>
    </div>
    <button (click)="openForm()"
            class="flex items-center gap-2 h-10 px-4 py-2 bg-emerald-600 text-white text-sm font-medium rounded-xl hover:bg-emerald-700 transition-colors shadow-sm">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
      </svg>
      Nueva área
    </button>
  </div>

  <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-slate-50 border-b border-slate-200">
        <tr>
          <th class="text-left px-4 py-3 font-semibold text-slate-600">Nombre</th>
          <th class="text-left px-4 py-3 font-semibold text-slate-600">Descripción</th>
          <th class="text-center px-4 py-3 font-semibold text-slate-600">Estado</th>
          <th class="text-center px-4 py-3 font-semibold text-slate-600">Acciones</th>
        </tr>
      </thead>
      <tbody class="divide-y divide-slate-100">
        @for (area of areas(); track area.id) {
          <tr class="hover:bg-slate-50 transition-colors">
            <td class="px-4 py-3 font-medium text-slate-800">{{ area.name }}</td>
            <td class="px-4 py-3 text-slate-500">{{ area.description || '—' }}</td>
            <td class="px-4 py-3 text-center">
              <span class="px-2 py-1 rounded-full text-xs font-medium"
                    [class.bg-green-100]="area.isActive"
                    [class.text-green-800]="area.isActive"
                    [class.bg-slate-100]="!area.isActive"
                    [class.text-slate-600]="!area.isActive">
                {{ area.isActive ? 'Activa' : 'Inactiva' }}
              </span>
            </td>
            <td class="px-4 py-3 text-center">
              <div class="flex items-center justify-center gap-2">
                <button (click)="openForm(area)" title="Editar"
                        class="p-1.5 hover:bg-blue-100 rounded-lg text-blue-600 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                  </svg>
                </button>
                <button (click)="deleteArea(area)" title="Eliminar"
                        class="p-1.5 hover:bg-red-100 rounded-lg text-red-600 transition-colors">
                  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                  </svg>
                </button>
              </div>
            </td>
          </tr>
        } @empty {
          <tr>
            <td colspan="4" class="px-4 py-6 text-center text-slate-500">No hay áreas registradas.</td>
          </tr>
        }
      </tbody>
    </table>
  </div>
</div>

<app-modal
  [isOpen]="showForm()"
  [title]="editingArea ? 'Editar área' : 'Nueva área'"
  iconEmoji="🗂️"
  iconBgClass="bg-emerald-50"
  confirmText="Guardar"
  confirmButtonClass="bg-emerald-600 hover:bg-emerald-700"
  (closeEvent)="closeForm()"
  (confirmEvent)="onSubmit()">
  <form [formGroup]="areaForm" class="space-y-3">
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Nombre *</label>
      <input formControlName="name"
             class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
             placeholder="Nombre del área">
    </div>
    <div>
      <label class="block text-xs font-medium text-slate-600 mb-1">Descripción</label>
      <textarea formControlName="description" rows="2"
                class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"
                placeholder="Detalles..."></textarea>
    </div>
    <div class="flex items-center gap-2">
      <input type="checkbox" formControlName="isActive" id="isActive" class="w-4 h-4 text-emerald-600 rounded">
      <label for="isActive" class="text-sm text-slate-600">Activa</label>
    </div>
  </form>
</app-modal>
