<div class="dashboard h-screen bg-slate-50 flex">
  <!-- Sidebar - Oculto para CEO -->
  <app-sidebar *ngIf="shouldShowSidebar()" />
  
  <!-- Main Content -->
  <main class="main-content flex-1 flex flex-col bg-slate-50 overflow-hidden transition-all duration-300 ease-in-out"
        [class.ml-64]="!sidebarCollapsed() && shouldShowSidebar()"
        [class.ml-16]="sidebarCollapsed() && shouldShowSidebar()">
    <!-- Header -->
    <app-header />
    
    <!-- Dynamic Content -->
    <div class="flex-1 main-content-scroll overflow-y-auto">
      <router-outlet></router-outlet>
    </div>
    
    <!-- Footer Fixed -->
    <app-footer />
  </main>
</div>

<app-confirm-dialog />
<app-network-status />
<app-sync-status />

<!-- Idle Timeout Warning -->
@if (idleTimeout.showWarning()) {
  <div class="fixed inset-0 bg-black/50 z-[9999] flex items-center justify-center">
    <div class="bg-white dark:bg-slate-800 rounded-xl p-6 shadow-xl max-w-md mx-4 text-center">
      <div class="text-amber-500 text-4xl mb-3">⏰</div>
      <h3 class="text-lg font-bold text-slate-900 dark:text-white mb-2">Sesión por expirar</h3>
      <p class="text-slate-600 dark:text-slate-300 mb-4">
        Su sesión se cerrará por inactividad en <strong>{{ idleTimeout.remainingSeconds() }}</strong> segundos.
      </p>
      <button (click)="idleTimeout.extendSession()"
              class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition-colors font-medium">
        Continuar trabajando
      </button>
    </div>
  </div>
}
